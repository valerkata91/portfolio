<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pyramids Hunter — Work</title>

<style>
  :root{
    --bg:#ffffff;
    --ink:#0a0a0a;
    --ink-2:#1d1d1f;
    --border:#e5e7eb;
    --site-max:880px;
    --bg-vector:url('img/background.webp');
  }

  * {
    font-family:"SF Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html, body {
    min-height:100%;
    background:var(--bg);
    background-image:var(--bg-vector);
    background-repeat:no-repeat;
    background-size:contain;
    background-attachment:fixed;
    color:var(--ink-2);
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }

  .wrap {
    max-width:var(--site-max);
    margin:0 auto;
    padding:0 16px;
  }

  /* HERO */
  .hero {
    position:relative;
    margin-top:0;
    overflow:hidden;
    border:none;           /* махаме бордъра */
    border-radius:0;       /* махаме закръглени ъгли */
  }

  .hero-img {
    width:100%;
    display:block;
  }

  .hero-img--desktop {
    display:block;
  }

  .hero-img--mobile {
    display:none;
  }

  .top-row {
    position:absolute;
    top:20px;
    left:37px;
    right:37px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:2;
    padding-top: env(safe-area-inset-top);
  }

  .back {
    width:45px;
    height:45px;
    border-radius:999px;
    background:#fff url('img/arrow-work.jpg') center/20px 15px no-repeat;
    border:1px solid var(--border);
    display:block;
  }

  .contact {
    background:linear-gradient(96.67deg,#FFFFFF 11.01%,#CFCFCF 91.21%);
    color:#000;
    text-decoration:none;
    border-radius:999px;
    padding:12px 16px;
    font-size:14px;
    font-weight:500;
    border:1px solid #bfbfbf;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
  }

  /* ===== MOBILE ===== */
  @media (max-width:560px){
    html,body {
      background-attachment:scroll;
      background-size:cover;
    }

    .wrap {
      margin:0;
      padding:0;
    }

    .hero {
      border:none;
      border-radius:0;
      overflow:visible;
    }

    .hero-img--desktop {
      display:none;
    }

    .hero-img--mobile {
      display:block;
      width:100%;
      height:auto;
    }

    .hero::before {
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:0;
      height:120px;
      z-index:1;
      background:linear-gradient(to bottom, rgba(0,0,0,.35), rgba(0,0,0,0));
      pointer-events:none;
    }

    .top-row {
		z-index: 2;
        left: 16px;
        right: 20px;
        top: 15px;
    }
  }
</style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="top-row">
        <a class="back" href="work.html" aria-label="Back"></a>
        <a class="contact" href="contact.html">Contact me</a>
      </div>

      <!-- Десктоп версия -->
      <img class="hero-img hero-img--desktop"
           src="img/magic-wheel-detail-desktop.png"
           alt="Pyramids Hunter desktop"
           decoding="async"
           loading="lazy">

      <!-- Мобилна версия -->
      <img class="hero-img hero-img--mobile"
           src="img/magic-wheel-detail-mobile.png"
           alt="Pyramids Hunter mobile"
           decoding="async"
           loading="lazy">
    </section>
  </main>
</body>
</html>
