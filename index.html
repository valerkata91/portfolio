<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Valeriia — UI/UX Designer</title>

<style>
  :root {
    --bg:#ffffff;
    --ink:#000000;
    --ink-2:#000000;
    --muted:#6b7280;
    --muted-2:#9ca3af;
    --border:#e5e7eb;
    --card-radius:20px;
    --site-max:880px;

    --body:16.5px;
    --small:14px;

    --arrow-size:14px;
    --arrow-src:url('img/arrow.png');
    --bg-vector:url('img/background.webp');

    /* Размер на аватара */
    --avatar-size:120px;
  }

  * {
    font-family:"SF Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html, body {
    height:100%;
    overflow-x:hidden;
    overflow-y:auto;
    background:var(--bg) var(--bg-vector) no-repeat fixed;
    background-size:contain;
    color:var(--ink-2);
    line-height:1.45;
  }

  .wrap {
    max-width:var(--site-max);
    margin:45px auto 64px;
    padding:0 16px;
  }

  .btn-pill {
    display: inline-flex;
  align-items: center;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: var(--small);
  color: #fff;
  background: linear-gradient(275.35deg, #000000 3.54%, #292C31 95.44%);
  text-decoration: none;
  transition: opacity .15s ease;
  }
  .btn-pill:hover { opacity:.85; }

  /* Header */
.header {
  display: grid;
  grid-template-columns: var(--avatar-size) 1fr;
  gap: 18px;
  align-items: center; /* центрира и аватара, и текста по височина */
  margin: 6px 0 10px;
}

  /* АВАТАР – изрязан като детелина чрез SVG clipPath */
  .avatar-svg {
    width:var(--avatar-size);
    height:var(--avatar-size);
    display:block;
  }

  .header-content {
  display: flex;
  flex-direction: column;
  justify-content: center; /* центрира текста и бутона вертикално */
}

  .header-top {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  h1 {
    font-size:35px;
    line-height:130%;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:400;
  }

  .wave-icon { width:32px; height:32px; vertical-align:middle; }

  .role { font-size:var(--body); color:#000000; }
  .role .sub { color:#a3a3a3; }

  /* Cards */
  .card {
    border:1px solid var(--border);
    border-radius:var(--card-radius);
    background:#fff;
    padding:26px 22px;
    margin-top:24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .card + .card { margin-top:24px; }
  .card-content { min-width:0; flex:1; }
  .label { font-size:16px; color:var(--muted-2); margin:0 0 6px; text-transform:uppercase; }
  .text { font-size:var(--body); color:var(--ink-2); margin:0; line-height:1.6; }
  .card-footer { margin-top:6px; display:flex; align-items:center; justify-content:flex-end; white-space:nowrap; }

  .icon { width:18px; height:18px; vertical-align:middle; margin-right:4px; }

  .link {
    font-size:17px;
    font-weight:400;
    color:var(--ink);
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    position:relative;
    padding-right:calc(var(--arrow-size) + 6px);
  }
  .link::after {
    content:"";
    position:absolute;
    right:0;
    top:50%;
    width:var(--arrow-size);
    height:var(--arrow-size);
    background:var(--arrow-src) no-repeat center/contain;
    transform:translateY(-50%);
  }
  .link:hover { text-decoration:underline; }

  /* Mobile */
  @media (max-width:560px){
    .header {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      text-align:center;
    }

    .header-content { display:contents; }
    .header-top { display:contents; }

    .header h1 {
      order:1;
      margin-bottom:4px;
      width:100%;
      text-align:left;
    }

    /* Аватарът става втори на мобилно */
    .avatar-svg {
  width: var(--avatar-size);
  height: var(--avatar-size);
  display: block;
  order: 2;
}

    :root { --avatar-size:132px; } /* по-голям аватар на мобилни */

    .header .role {
      order:3;
      margin:6px 0 8px;
    }

    .header .btn-pill {
      order:4;
      margin-top:0;
    }

    .btn-pill {
      padding:12px 20px;
      font-size:15px;
    }

    .wave-icon { width:26px; height:26px; }

    /* Картите на мобилно – линкът под текста */
    .card {
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
    }
    .card-footer {
      width:100%;
      justify-content:flex-start;
      margin-top:0;
    }
    .card-footer .link {
      font-size:16px;
    }
	  .wrap {
    margin: 15px auto 64px; /* вместо 45px горен маргин */
    padding: 0 16px;        /* запазва падинга за вътрешно отстояние */
  }
  }
</style>
</head>

<body>
  <main class="wrap">
    <!-- Hero -->
    <section class="header">
      <!-- SVG с клип път (4 кръга). Снимката се изрязва по формата -->
      <svg viewBox="0 0 100 100" class="avatar-svg" aria-label="Valeriia avatar">
        <defs>
          <clipPath id="clover">
            <circle cx="30" cy="30" r="30" />
            <circle cx="70" cy="30" r="30" />
            <circle cx="30" cy="70" r="30" />
            <circle cx="70" cy="70" r="30" />
          </clipPath>
        </defs>
        <!-- сложи своя аватар тук -->
        <image href="img/avatar.png"
               x="0" y="0" width="100" height="100"
               preserveAspectRatio="xMidYMid slice"
               clip-path="url(#clover)"/>
      </svg>

      <div class="header-content">
        <div class="header-top">
          <h1>
            Hi, I’m Valeriia
            <img src="img/wave.png" alt="wave" class="wave-icon">
          </h1>
          <a class="btn-pill" href="contact.html">Contact me</a>
        </div>
        <p class="role">
          UI/UX Designer from Ukraine,<br>
          <span class="sub">currently based in Bulgaria</span>
        </p>
      </div>
    </section>

    <!-- Card 1: Skills -->
    <section class="card">
      <div class="card-content">
        <p class="label">What I’m good at</p>
        <p class="text">
          <img src="img/strategy.png" alt="UX strategy" class="icon">UX strategy · 
          <img src="img/intuitive.png" alt="Intuitive UI" class="icon">Intuitive UI ·<br>
          <img src="img/flows.png" alt="Flows and logic" class="icon">Flows & logic · 
          <img src="img/figma.png" alt="Figma components" class="icon">Figma components
        </p>
      </div>
      <div class="card-footer">
        <a class="link" href="cv.pdf">My CV</a>
      </div>
    </section>

    <!-- Card 2: Work -->
    <section class="card">
      <div class="card-content">
        <p class="label">Explore my work</p>
        <p class="text">
          Designing intuitive fintech platforms,<br>
          engaging sports apps & casual games
        </p>
      </div>
      <div class="card-footer">
        <a class="link" href="work.html">Explore my work</a>
      </div>
    </section>
  </main>
</body>
</html>
