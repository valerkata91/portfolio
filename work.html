<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Valeriia — Work</title>

<style>
  :root{
    --bg:#ffffff;
    --ink:#0a0a0a;
    --ink-2:#1d1d1f;
    --card:#ffffff;
    --border:#e5e7eb;
    --radius:30px;
    --site-max:880px;
    --bg-vector:url('img/background.webp');
  }

  *{
    font-family:"SF Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-weight:400;
    font-style:normal;
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
    overflow-x: hidden;
    overflow-y: scroll; /* постоянен скролбар, за да няма „подскачане“ */
    background-color: var(--bg);
    background-image: var(--bg-vector);
    background-repeat: no-repeat;
    background-size: contain;
    background-attachment: fixed;
    color: var(--ink-2);
    line-height: 1.45;
  }

  .wrap{
    max-width:var(--site-max);
    margin:45px auto 64px;
    padding:0 16px;
  }

  .top{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:20px;
  }

  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  .back{
    width:36px;
    height:36px;
    border-radius:999px;
    background:#fff url('img/arrow-work.jpg') center center no-repeat;
    background-size: 16px 12px;
    border:1px solid var(--border);
    display:block;
    cursor:pointer;
    text-decoration:none;
  }

  .contact{
    background:#111;
    color:#fff;
    text-decoration:none;
    border-radius:999px;
    padding:10px 16px;
    font-size:14px;
  }

  /* Filters */
  .filters{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:4px;
    scroll-snap-type:x proximity;
  }
  .filters::-webkit-scrollbar{ display:none; }
  .filters{ scrollbar-width:none; }

  .chip{
    flex:0 0 auto;
    scroll-snap-align:start;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    padding:6px 10px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#fff;
    color:#111;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
    transition: background .2s ease, color .2s ease;
  }
  .chip img{
    width:16px;
    height:16px;
    object-fit:contain;
  }
  .chip.is-active{
    background:#111;
    color:#fff;
    border-color:#111;
  }

  /* Grid */
  .grid{
    display:grid;
    gap:28px;
    grid-template-columns:repeat(3, minmax(0,1fr));
    margin-top:10px;
    align-items:start;
    transition: height .2s ease;
  }
  @media (max-width:1024px){
    .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media (max-width:640px){
    .grid{ grid-template-columns:1fr; }
  }

  /* Card wrapper link */
  .card-link{
    display: contents;
    color: inherit;
    text-decoration: none;
  }

  /* Cards */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .card-head{
    padding:18px 18px 10px 18px;
  }
  .card-title{
    font-size:20px;
    color:#0a0a0a;
    margin-bottom:10px;
  }
  .thumb{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
    border-bottom-left-radius:var(--radius);
    border-bottom-right-radius:var(--radius);
  }

  .hidden{ display:none !important; }

  /* Mobile tweaks */
  @media (max-width: 640px) {
    .filters {
      gap: 12px;
      padding-bottom: 6px;
      padding-top: 10px;
    }

    .chip {
      font-size: 16px;
      padding: 8px 14px;
    }

    .chip img {
      width: 18px;
      height: 18px;
    }
  }
  @media (max-width:560px){
    .wrap {
      margin: 15px auto 64px;
      padding: 0 16px;
    }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <div class="top-row">
        <a class="back" href="index.html" aria-label="Back"></a>
        <a class="contact" href="mailto:valeriia@example.com">Contact me</a>
      </div>

      <div class="filters" id="filters" aria-label="Project categories">
        <button class="chip is-active" data-filter="all">All</button>
        <button class="chip" data-filter="gambling">
          <img src="img/gambling.png" alt="Gambling">Gambling
        </button>
        <button class="chip" data-filter="fintech">
          <img src="img/fintech.png" alt="Fintech">Fintech
        </button>
        <button class="chip" data-filter="sport">
          <img src="img/sport.png" alt="Sport">Sport
        </button>
      </div>
    </div>

    <!-- Grid -->
    <section class="grid" id="workGrid">
      <a href="magic-wheel.html" class="card-link">
        <article class="card" data-cat="gambling">
          <div class="card-head"><h3 class="card-title">Magic Wheel</h3></div>
          <img class="thumb" src="img/magic-wheel.png" alt="Magic Wheel">
        </article>
      </a>

 <a href="pyramids-hunter-detail.html" class="card-link">
      <article class="card" data-cat="gambling">
        <div class="card-head"><h3 class="card-title">Pyramids Hunter</h3></div>
        <img class="thumb" src="img/pyramids-hunter.png" alt="Pyramids Hunter">
      </article>
	   </a>

      <article class="card" data-cat="fintech">
        <div class="card-head"><h3 class="card-title">Piggly</h3></div>
        <img class="thumb" src="img/piggly.png" alt="Piggly">
      </article>

      <article class="card" data-cat="gambling">
        <div class="card-head"><h3 class="card-title">Blackjack</h3></div>
        <img class="thumb" src="img/blackjack.png" alt="Blackjack">
      </article>

      <article class="card" data-cat="gambling">
        <div class="card-head"><h3 class="card-title">Candy Saga</h3></div>
        <img class="thumb" src="img/candy-saga.png" alt="Candy Saga">
      </article>

      <article class="card" data-cat="sport">
        <div class="card-head"><h3 class="card-title">Sporta</h3></div>
        <img class="thumb" src="img/sporta.png" alt="Sporta">
      </article>

      <article class="card" data-cat="fintech">
        <div class="card-head"><h3 class="card-title">Revalo</h3></div>
        <img class="thumb" src="img/revalo.png" alt="Revalo">
      </article>

      <article class="card" data-cat="gambling">
        <div class="card-head"><h3 class="card-title">Dream Land</h3></div>
        <img class="thumb" src="img/dream-land.png" alt="Dream Land">
      </article>

      <article class="card" data-cat="gambling">
        <div class="card-head"><h3 class="card-title">Color Rush</h3></div>
        <img class="thumb" src="img/color-rush.png" alt="Color Rush">
      </article>

      <article class="card" data-cat="gambling">
        <div class="card-head"><h3 class="card-title">Plinko</h3></div>
        <img class="thumb" src="img/plinko.png" alt="Plinko">
      </article>

      <article class="card" data-cat="sport">
        <div class="card-head"><h3 class="card-title">FootApp</h3></div>
        <img class="thumb" src="img/foot-app.png" alt="FootApp">
      </article>

      <article class="card" data-cat="fintech">
        <div class="card-head"><h3 class="card-title">FinPath</h3></div>
        <img class="thumb" src="img/fin-path.png" alt="FinPath">
      </article>

      <article class="card" data-cat="fintech">
        <div class="card-head"><h3 class="card-title">TrackFi</h3></div>
        <img class="thumb" src="img/track-fi.png" alt="TrackFi">
      </article>

      <article class="card" data-cat="fintech">
        <div class="card-head"><h3 class="card-title">Credify</h3></div>
        <img class="thumb" src="img/credify.png" alt="Credify">
      </article>

      <article class="card" data-cat="fintech">
        <div class="card-head"><h3 class="card-title">Plana</h3></div>
        <img class="thumb" src="img/plana.png" alt="Plana">
      </article>
    </section>
  </main>

  <script>
    const chips = document.querySelectorAll('.chip');
    const cards = document.querySelectorAll('.card');
    const grid  = document.getElementById('workGrid');

    function applyFilter(filter) {
      // активен чип
      chips.forEach(c => c.classList.toggle('is-active', c.dataset.filter === filter || (filter === 'all' && c.dataset.filter === 'all')));

      // показване/скриване на картите
      cards.forEach(card => {
        const gridItem = card.closest('.card-link') || card;
        const show = (filter === 'all' || card.dataset.cat === filter);
        gridItem.classList.toggle('hidden', !show);
      });

      // премахваме всякакъв фикс за височина
      grid.style.minHeight = '';
    }

    chips.forEach(chip => {
      chip.addEventListener('click', () => applyFilter(chip.dataset.filter));
    });

    window.addEventListener('load', () => applyFilter('all'));
  </script>
</body>
</html>
